<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Tratamentos</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <h1>Cadastro de Tratamentos</h1>

    <form id="formTratamento">

        <label>Tratamento</label>
        <input type="text" id="tratamento" required>

        <label>Descrição</label>
        <input type="text" id="descricao" required>

        <label>Valor</label>
        <input type="number" id="valor" required>

        <button type="submit">Salvar</button>

    </form>

    <p id="resultadoTratamento"></p>

</div>

<script src="js/tratamentos.js"></script>

</body>
</html>
