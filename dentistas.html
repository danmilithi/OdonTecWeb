<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dentistas</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <h1>Cadastro de Dentistas</h1>

    <form id="formDentista">

        <label>Nome</label>
        <input type="text" id="nomeDentista" required>

        <label>CRO</label>
        <input type="text" id="cro" required>

        <label>Especialidade</label>
        <input type="text" id="especialidade" required>

        <button type="submit">Salvar</button>

    </form>

    <p id="resultadoDentista"></p>

</div>

<script src="js/dentistas.js"></script>

</body>
</html>
