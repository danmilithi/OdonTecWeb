<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Agenda</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <h1>Agenda de Consultas</h1>

    <form id="formAgenda">

        <label>Paciente</label>
        <input type="text" id="pacienteAgenda" required>

        <label>Dentista</label>
        <input type="text" id="dentistaAgenda" required>

        <label>Data</label>
        <input type="date" id="dataAgenda" required>

        <button type="submit">Agendar</button>

    </form>

    <p id="resultadoAgenda"></p>

</div>

<script src="js/agenda.js"></script>

</body>
</html>
